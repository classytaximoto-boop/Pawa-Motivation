name: Générer l'APK Android (TWA)

# Se lance à la main depuis l'onglet "Actions" de GitHub, une fois que la PWA
# est bien en ligne sur GitHub Pages (voir deploy-pages.yml).
# pwa_url doit pointer vers cette URL publique, ex :
# https://<ton-user>.github.io/<ton-repo>/
on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: "URL publique de la PWA (GitHub Pages), avec le / final"
        required: true
        default: "https://TON-USER.github.io/TON-REPO/"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le JDK (requis par Bubblewrap/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android (déjà présent sur le runner, on force juste les licences)
        uses: android-actions/setup-android@v3

      - name: Installer Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pré-configurer Bubblewrap (JDK + SDK déjà installés, évite les questions interactives)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restaurer le keystore de signature depuis les secrets GitHub
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa-project
          echo "$KEYSTORE_BASE64" | base64 -d > twa-project/android.keystore

      - name: Initialiser le projet Android (génère twa-manifest.json directement, sans prompt interactif)
        # "bubblewrap init" est interactif et n'est pas conçu pour tourner en CI
        # (aucun flag ne permet de le rendre non-interactif). On contourne le
        # problème en générant nous-mêmes twa-manifest.json via un script
        # Python séparé (.github/scripts/generate-twa-manifest.py), puis en
        # lançant "bubblewrap update", qui régénère le projet Android à partir
        # de ce fichier sans poser aucune question.
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p twa-project
          python3 .github/scripts/generate-twa-manifest.py "$PWA_URL" twa-project/twa-manifest.json
          cd twa-project
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Générer l'APK
        working-directory: twa-project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: boost-apk
          path: |
            twa-project/app-release-signed.apk
            twa-project/app-release-unsigned.apk
          if-no-files-found: warn
