name: Générer l'APK Android (TWA)

# Se lance à la main depuis l'onglet "Actions" de GitHub, une fois que la PWA
# est bien en ligne sur GitHub Pages (voir deploy-pages.yml).
# pwa_url doit pointer vers cette URL publique, ex :
# https://<ton-user>.github.io/<ton-repo>/
on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: "URL publique de la PWA (GitHub Pages), avec le / final"
        required: true
        default: "https://TON-USER.github.io/TON-REPO/"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le JDK (requis par Bubblewrap/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android (déjà présent sur le runner, on force juste les licences)
        uses: android-actions/setup-android@v3

      - name: Installer Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pré-configurer Bubblewrap (JDK + SDK déjà installés, évite les questions interactives)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Initialiser le projet Android à partir du manifest de la PWA
        env:
          # Séquence complète des questions posées par "bubblewrap init"
          # (JDK/SDK déjà résolus via ~/.bubblewrap/config.json, donc on
          # commence directement à "Web app details (1/5)") :
          #  1) Domain              -> Entrée (valeur auto-détectée du manifest)
          #  2) URL path            -> Entrée (valeur par défaut "/")
          #  3) Application name    -> Entrée (valeur du manifest)
          #  4) Short name          -> Entrée
          #  5) Application ID      -> Entrée
          #  6) Starting version code -> Entrée (1)
          #  7) Display mode        -> Entrée (standalone)
          #  8) Orientation         -> Entrée (default)
          #  9) Status bar color    -> Entrée
          # 10) Splash screen color -> Entrée
          # 11) Icon URL            -> Entrée (valeur du manifest)
          # 12) Maskable icon URL   -> Entrée (optionnel, vide)
          # 13) Monochrome icon URL -> Entrée (optionnel, vide)
          # 14) Play Billing ?      -> n (No)
          # 15) Geolocation ?       -> n (No)
          # 16) Key store location  -> Entrée (chemin par défaut proposé)
          # 17) Key name            -> Entrée (alias par défaut "android")
          # 18) Create keystore now? -> Y (Yes)
          # 19) First and Last names -> "BOOST App"
          # 20) Organizational Unit -> "BOOST"
          # 21) Organization        -> "BOOST"
          # 22) Country (2 lettres) -> "MG"
          # 23) Password Key Store  -> mot de passe (via var d'env plus bas)
          # 24) Password Key        -> mot de passe (via var d'env plus bas)
          BUBBLEWRAP_KEYSTORE_PASSWORD: boost-apk-2026
          BUBBLEWRAP_KEY_PASSWORD: boost-apk-2026
        run: |
          printf '\n\n\n\n\n\n\n\n\n\n\n\n\nn\nn\n\n\nY\nBOOST App\nBOOST\nBOOST\nMG\nboost-apk-2026\nboost-apk-2026\n' | bubblewrap init \
            --manifest="${{ github.event.inputs.pwa_url }}manifest.webmanifest" \
            --directory=twa-project \
            --skipPwaValidation

      - name: Générer l'APK
        working-directory: twa-project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: boost-apk-2026
          BUBBLEWRAP_KEY_PASSWORD: boost-apk-2026
        run: bubblewrap build --skipPwaValidation

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: boost-apk
          path: |
            twa-project/app-release-signed.apk
            twa-project/app-release-unsigned.apk
          if-no-files-found: warn
